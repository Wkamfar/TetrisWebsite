<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris Secret</title>
    <link rel="icon" href="Lily.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        /* Apply the game font */
        body {
            font-family: 'Press Start 2P', cursive;
            overscroll-behavior: none; /* Prevent pull-to-refresh */
        }
        /* Style for the game canvas */
        canvas {
            display: block;
            margin: 0 auto;
            background-color: #1a202c; /* Dark background for the grid */
            border: 4px solid #4a5568; /* Gray border */
            border-radius: 0.5rem; /* Rounded corners */
        }
        /* Style for buttons */
        .game-button {
            font-family: 'Press Start 2P', cursive;
            background-color: #4a5568; /* Gray */
            color: white;
            padding: 0.75rem 1.5rem;
            border: 2px solid #2d3748; /* Darker gray border */
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background-color 0.2s ease;
            box-shadow: 0 4px #2d3748; /* Button shadow */
            margin: 0 0.25rem; /* Spacing between buttons */
            touch-action: manipulation; /* Improve touch responsiveness */
            /* Prevent text selection */
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
        .game-button:active {
            background-color: #2d3748; /* Darker gray on press */
            box-shadow: 0 2px #2d3748;
            transform: translateY(2px);
        }
        /* Style for message box */
        #message-box {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 2rem;
            border-radius: 0.5rem;
            text-align: center;
            z-index: 100;
            font-size: 1.5rem; /* Larger font for message */
        }
        #message-box button {
             margin-top: 1rem;
        }
    </style>
</head>
<body class="bg-gray-900 text-white flex flex-col items-center justify-center min-h-screen p-4">

    <h1 class="text-4xl mb-4 text-yellow-400">TETRIS</h1>

    <div class="text-center mb-4 p-4 bg-gray-800 rounded-lg shadow-md">
        <p class="text-lg">Score: <span id="score" class="text-green-400">0</span></p>
        <p id="secret-message" class="text-sm text-cyan-400 mt-2">Reach 2500 points to unlock a secret!</p>
    </div>

    <canvas id="tetrisCanvas" width="240" height="480"></canvas>

    <div class="mt-6 flex justify-center items-center flex-wrap">
        <button id="left-btn" class="game-button">LEFT</button>
        <button id="rotate-btn" class="game-button">ROTATE</button>
        <button id="down-btn" class="game-button">DOWN</button>
        <button id="right-btn" class="game-button">RIGHT</button>
    </div>
     <button id="start-btn" class="game-button mt-4 bg-green-600 hover:bg-green-700 shadow-green-800 border-green-800">START</button>

    <div id="message-box" class="hidden">
        <p id="message-text"></p>
        <button id="restart-btn" class="game-button bg-blue-600 hover:bg-blue-700 shadow-blue-800 border-blue-800">START</button>
    </div>

    <audio id="background-music" src="TetrisTheme.mp3" loop preload="auto"></audio>

    <script>
        // --- Game Setup ---
        const canvas = document.getElementById('tetrisCanvas');
        const context = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const secretMessageElement = document.getElementById('secret-message');
        const messageBox = document.getElementById('message-box');
        const messageText = document.getElementById('message-text');
        const startButton = document.getElementById('start-btn');
        const restartButton = document.getElementById('restart-btn');
        const backgroundMusic = document.getElementById('background-music'); // Get audio element

        // Game constants
        const COLS = 10;
        const ROWS = 20;
        const BLOCK_SIZE = 24; // Pixel size of each block
        const SECRET_SCORE_TARGET = 2500; // Score needed to unlock the secret

        // Tetromino shapes and colors
        const TETROMINOES = {
            'I': { shape: [[1, 1, 1, 1]], color: '#00FFFF' }, // Cyan
            'J': { shape: [[1, 0, 0], [1, 1, 1]], color: '#0000FF' }, // Blue
            'L': { shape: [[0, 0, 1], [1, 1, 1]], color: '#FFA500' }, // Orange (Corrected the typo here)
            'O': { shape: [[1, 1], [1, 1]], color: '#FFFF00' }, // Yellow
            'S': { shape: [[0, 1, 1], [1, 1, 0]], color: '#00FF00' }, // Green
            'T': { shape: [[0, 1, 0], [1, 1, 1]], color: '#800080' }, // Purple
            'Z': { shape: [[1, 1, 0], [0, 1, 1]], color: '#FF0000' }  // Red
        };
        const TETROMINO_KEYS = Object.keys(TETROMINOES);

        // Game state variables
        let board = createBoard();
        let currentPiece;
        let currentX;
        let currentY;
        let score = 0;
        let gameOver = false;
        let gameLoopTimeout;
        let dropInterval = 1000; // Milliseconds between drops
        let lastDropTime = 0;
        let gameRunning = false; // To track if the game has started

        // --- Game Board ---
        function createBoard() {
            // Initialize the game board grid with zeros (empty cells)
            return Array.from({ length: ROWS }, () => Array(COLS).fill(0));
        }

        // --- Tetromino Handling ---
        function getRandomTetromino() {
            // Select a random tetromino shape
            const key = TETROMINO_KEYS[Math.floor(Math.random() * TETROMINO_KEYS.length)];
            const tetromino = TETROMINOES[key];
            return {
                shape: tetromino.shape,
                color: tetromino.color,
                x: Math.floor(COLS / 2) - Math.ceil(tetromino.shape[0].length / 2), // Center horizontally
                y: 0 // Start at the top
            };
        }

        function rotateTetromino(piece) {
            // Transpose the shape matrix
            const rows = piece.shape.length;
            const cols = piece.shape[0].length;
            const newShape = Array.from({ length: cols }, () => Array(rows).fill(0));

            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    if (piece.shape[y][x]) {
                        newShape[x][rows - 1 - y] = 1;
                    }
                }
            }
            return newShape;
        }

        // --- Drawing ---
        function drawBlock(x, y, color) {
            // Draw a single block on the canvas
            context.fillStyle = color;
            context.fillRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
            context.strokeStyle = '#1a202c'; // Dark border for blocks
            context.lineWidth = 1;
            context.strokeRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
        }

        function drawBoard() {
            // Draw the static blocks on the board
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    if (board[y][x]) {
                        drawBlock(x, y, board[y][x]); // Use stored color
                    } else {
                        // Draw empty cell background slightly lighter
                        context.fillStyle = '#2d3748'; // Slightly lighter gray
                        context.fillRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
                        context.strokeStyle = '#1a202c'; // Dark border
                         context.lineWidth = 0.5;
                        context.strokeRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
                    }
                }
            }
        }

        function drawPiece(piece) {
            // Draw the currently falling tetromino
            piece.shape.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value) {
                        drawBlock(piece.x + x, piece.y + y, piece.color);
                    }
                });
            });
        }

        // --- Collision Detection ---
        function isValidMove(newX, newY, shape) {
            for (let y = 0; y < shape.length; y++) {
                for (let x = 0; x < shape[0].length; x++) {
                    if (shape[y][x]) {
                        let boardX = newX + x;
                        let boardY = newY + y;

                        // Check boundaries
                        if (boardX < 0 || boardX >= COLS || boardY >= ROWS) {
                            return false;
                        }
                        // Check collision with existing blocks on the board (only if below row 0)
                        if (boardY >= 0 && board[boardY][boardX]) {
                            return false;
                        }
                    }
                }
            }
            return true;
        }

        // --- Game Logic ---
        function freezePiece(piece) {
            // Add the piece's blocks to the main board
            piece.shape.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value) {
                        // Check if block is above the top boundary (game over condition)
                        if (piece.y + y < 0) {
                            gameOver = true;
                            return;
                        }
                        board[piece.y + y][piece.x + x] = piece.color; // Store color
                    }
                });
            });
             if (gameOver) return; // Don't clear lines if game is over

            clearLines(); // Check for completed lines after freezing
            currentPiece = getRandomTetromino(); // Get the next piece
             // Check for immediate collision with the new piece (game over)
            if (!isValidMove(currentPiece.x, currentPiece.y, currentPiece.shape)) {
                gameOver = true;
            }
        }

        function clearLines() {
            let linesCleared = 0;
            for (let y = ROWS - 1; y >= 0; y--) {
                if (board[y].every(cell => cell)) { // Check if row is full
                    linesCleared++;
                    // Remove the full row and add an empty row at the top
                    board.splice(y, 1);
                    board.unshift(Array(COLS).fill(0));
                    y++; // Re-check the current row index as rows shifted down
                }
            }

            // Update score based on lines cleared
            if (linesCleared > 0) {
                let pointsEarned = 0;
                switch (linesCleared) {
                    case 1: pointsEarned = 100; break;
                    case 2: pointsEarned = 300; break;
                    case 3: pointsEarned = 500; break;
                    case 4: pointsEarned = 800; break; // Tetris!
                }
                score += pointsEarned;
                scoreElement.textContent = score;

                // Increase speed slightly after clearing lines
                if (dropInterval > 200) { // Set a minimum interval
                   dropInterval -= linesCleared * 10;
                }


                // Check for secret unlock
                if (score >= SECRET_SCORE_TARGET) {
                    unlockSecret();
                }
            }
        }

        function movePiece(dx, dy) {
            if (!gameRunning || gameOver) return;
            const newX = currentPiece.x + dx;
            const newY = currentPiece.y + dy;
            if (isValidMove(newX, newY, currentPiece.shape)) {
                currentPiece.x = newX;
                currentPiece.y = newY;
                return true; // Move was successful
            }
            return false; // Move failed
        }

        function rotateCurrentPiece() {
             if (!gameRunning || gameOver) return;
            const rotatedShape = rotateTetromino(currentPiece);
            let kickX = 0; // Wall kick offset

            if (!isValidMove(currentPiece.x, currentPiece.y, rotatedShape)) {
                // Try wall kicks (simple version: try moving 1 left or 1 right)
                if (isValidMove(currentPiece.x + 1, currentPiece.y, rotatedShape)) {
                    kickX = 1;
                } else if (isValidMove(currentPiece.x - 1, currentPiece.y, rotatedShape)) {
                    kickX = -1;
                } else {
                    return; // Rotation failed even with kicks
                }
            }
            currentPiece.shape = rotatedShape;
            currentPiece.x += kickX; // Apply kick if needed
        }


        function dropPiece() {
            if (!gameRunning || gameOver) return;
            if (!movePiece(0, 1)) {
                // Piece couldn't move down, freeze it
                freezePiece(currentPiece);
                if (gameOver) {
                    endGame();
                }
            }
            lastDropTime = Date.now(); // Reset drop timer after manual drop or freeze
        }

        function unlockSecret() {
            if (!gameOver) { // Only redirect if game isn't over
                console.log("Secret Unlocked! Redirecting...");
                // Stop the game loop and music before redirecting
                if (gameLoopTimeout) clearTimeout(gameLoopTimeout);
                backgroundMusic.pause(); // Pause music before leaving page
                gameRunning = false;
                window.location.href = 'secret.html'; // Redirect to the secret page
            }
        }

        function showMessage(text) {
            messageText.textContent = text;
            messageBox.classList.remove('hidden');
        }

        function hideMessage() {
            messageBox.classList.add('hidden');
        }

        function startGame() {
            if (gameRunning) return; // Prevent multiple starts

            // Reset game state
            board = createBoard();
            score = 0;
            gameOver = false;
            dropInterval = 1000;
            lastDropTime = Date.now();
            scoreElement.textContent = score;
            secretMessageElement.classList.remove('hidden'); // Show secret message again
            hideMessage();

            currentPiece = getRandomTetromino();
            gameRunning = true;
            startButton.disabled = true; // Disable start button while playing
            startButton.classList.add('opacity-50', 'cursor-not-allowed');

            // --- Play Background Music ---
            // Use a try-catch block for browser autoplay policies
            backgroundMusic.currentTime = 0; // Restart music from beginning
            const playPromise = backgroundMusic.play();
            if (playPromise !== undefined) {
                playPromise.then(_ => {
                    // Autoplay started!
                    console.log("Background music started.");
                }).catch(error => {
                    // Autoplay was prevented.
                    console.warn("Background music autoplay prevented:", error);
                    // Optionally, show a message or button to enable music manually
                });
            }

            gameLoop(); // Start the game loop
        }

        function endGame() {
            gameOver = true;
            gameRunning = false;
            if (gameLoopTimeout) clearTimeout(gameLoopTimeout);
            showMessage("GAME OVER! Score: " + score);
            startButton.disabled = false; // Re-enable start button
            startButton.classList.remove('opacity-50', 'cursor-not-allowed');
            secretMessageElement.classList.add('hidden'); // Hide secret message on game over

            // --- Pause Background Music ---
            backgroundMusic.pause();
            console.log("Background music paused.");
        }

        // --- Game Loop ---
        function gameLoop() {
            if (gameOver || !gameRunning) {
                return; // Stop the loop if game over or not running
            }

            const now = Date.now();
            const delta = now - lastDropTime;

            // Clear canvas
            context.clearRect(0, 0, canvas.width, canvas.height);

            // Draw elements
            drawBoard();
            drawPiece(currentPiece);

            // Automatic drop based on interval
            if (delta > dropInterval) {
                dropPiece(); // This handles movement, freezing, line clearing, and game over check
                lastDropTime = now; // Reset timer
            }

            // Request next frame
             if (!gameOver && gameRunning) { // Only continue loop if game is active
                gameLoopTimeout = setTimeout(gameLoop, 1000 / 60); // Aim for 60 FPS redraw, but logic runs slower
            }
        }

        // --- Event Listeners ---
        document.addEventListener('keydown', (event) => {
             if (!gameRunning || gameOver) return; // Ignore keys if game not running

            switch (event.key) { // Use event.key for modern browsers
                case 'ArrowLeft':
                    movePiece(-1, 0);
                    break;
                case 'ArrowRight':
                    movePiece(1, 0);
                    break;
                case 'ArrowDown':
                    dropPiece(); // Move down faster
                    break;
                case 'ArrowUp':
                    rotateCurrentPiece();
                    break;
                 case ' ': // Space bar for instant drop (optional)
                    while(movePiece(0, 1)) { /* Keep moving down */ }
                    freezePiece(currentPiece);
                     if (gameOver) endGame();
                    lastDropTime = Date.now(); // Reset timer after hard drop
                    break;
            }
            // Prevent default arrow key scrolling
            if (['ArrowLeft', 'ArrowRight', 'ArrowDown', 'ArrowUp', ' '].includes(event.key)) {
                event.preventDefault();
            }

             // Redraw immediately after input for responsiveness
            if (!gameOver && gameRunning) {
                 context.clearRect(0, 0, canvas.width, canvas.height);
                 drawBoard();
                 drawPiece(currentPiece);
            }
        });

         // Touch Controls Listeners
        document.getElementById('left-btn').addEventListener('click', () => movePiece(-1, 0));
        document.getElementById('right-btn').addEventListener('click', () => movePiece(1, 0));
        document.getElementById('down-btn').addEventListener('click', () => dropPiece());
        document.getElementById('rotate-btn').addEventListener('click', () => rotateCurrentPiece());

        // Start and Restart Button Listeners
        startButton.addEventListener('click', startGame);
        restartButton.addEventListener('click', startGame); // Restart button calls startGame

        // Initial drawing (optional, shows empty board before start)
        drawBoard();
        showMessage("Press START to Play!"); // Initial message

    </script>

</body>
</html>
